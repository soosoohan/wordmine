<body>
<button class="back-button" onclick="location.href='https://soosooland.com'">←</button>
<h1 id="game-title">워드마인</h1>
<p id="game-desc">주변 숫자 힌트를 보고 한글 단어를 찾아보세요!</p>

<div id="difficultyScreen">
  <div class="difficulty-buttons">
  <button class="difficulty-btn" onclick="setDifficulty('normal')">쉬움</button>
  <button class="difficulty-btn" onclick="setDifficulty('hard')">어려움</button>
</div>
</div>

<div id="gameScreen">
<div id="currentTurn"></div>

<div class="container">
  <div id="npcScore"><h2>컴퓨터:</h2></div>
  <div id="game"></div>
  <div id="userScore"><h2>사용자:</h2></div>
</div>

<div class="score-container">
  <div id="npcScore-mobile"><h2>컴퓨터:</h2></div>
  <div id="userScore-mobile"><h2>사용자:</h2></div>
</div>

<div class="btn-container">
  <button id="retryBtn">↻ 다시 시작</button>
</div>
</div>

<script>
const gridSize = 10;
const totalCells = gridSize * gridSize;
let npcDifficulty = 'normal';

function setDifficulty(level) {
  npcDifficulty = level;
  document.querySelectorAll('.difficulty-btn').forEach(btn => btn.classList.remove('active'));
  event.target.classList.add('active');
}

let board, revealed, wordMap, foundWords, currentPlayer, foundBy, words, usedIndexes;
let resultShown = false;
let npcTimeoutId = null;

const gameEl = document.getElementById('game');
const userScoreEl = document.getElementById('userScore');
const npcScoreEl = document.getElementById('npcScore');
const userScoreMobileEl = document.getElementById('userScore-mobile');
const npcScoreMobileEl = document.getElementById('npcScore-mobile');
const retryBtn = document.getElementById('retryBtn');
const currentTurnEl = document.getElementById('currentTurn');

function startGame(difficulty) {
  npcDifficulty = difficulty;
  init();
}

function getAdjacentCells(index) {
  const x = index % gridSize, y = Math.floor(index / gridSize);
  const adjacent = [];
  for (let dy = -1; dy <= 1; dy++) {
    for (let dx = -1; dx <= 1; dx++) {
      if (dx === 0 && dy === 0) continue;
      const nx = x + dx, ny = y + dy;
      if (nx >= 0 && nx < gridSize && ny >= 0 && ny < gridSize) {
        const nIdx = ny * gridSize + nx;
        if (!revealed[nIdx]) adjacent.push(nIdx);
      }
    }
  }
  return adjacent;
}

window.onload = () => {
  const urlParams = new URLSearchParams(window.location.search);
  const poolFile = urlParams.get('pool');
  if (!poolFile) {
    words = ["계륵","각골난망", "각양각색", "각인각색", "각자도생", "각주구검", "간난신고", "간담상조", "감개무량", "감언이설", "감지덕지", "갑론을박","가화만사성"];
    init();
    return;
  }

  // 워드마인 전용 워드풀 (게임 이름이 JSON 안에 포함되어 있음)
  fetch('https://soosooland.com/wordmine/wordpools/' + poolFile + '.json')
    .then(res => res.json())
    .then(data => {
      document.getElementById('game-title').textContent = data.title || '워드마인';
      const rawText = data.description || '게임 설명';
      const htmlText = rawText.replace(/\n/g, '<br>');
      document.getElementById('game-desc').innerHTML = htmlText;

      words = [];
      for (let length in data.words) {
        const count = data.wordCount[length] || 0;
        words.push(...getRandomSample(data.words[length], count));
      }
      init();
    })
    .catch(err => {
      document.body.innerHTML = '<p>❌ 워드풀 로딩 중 오류 발생: ' + err.message + '</p>';
    });
};

function shuffle(arr) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
}

function getRandomSample(arr, count) {
  if (count >= arr.length) return [...arr];
  const shuffled = [...arr];
  shuffle(shuffled);
  return shuffled.slice(0, count);
}

function init() {
  board = Array(totalCells).fill(null);
  revealed = Array(totalCells).fill(false);
  wordMap = {};
  foundWords = new Set();
  foundBy = { user: [], npc: [] };
  currentPlayer = 'user';
  usedIndexes = new Set();
  resultShown = false;

  if (npcTimeoutId) { clearTimeout(npcTimeoutId); npcTimeoutId = null; }

  createGrid();

  if (!placeAllWordsWithVariety()) {
    const sortedWords = [...words].sort((a, b) => b.length - a.length);
    for (let word of sortedWords) {
      for (let attempt = 0; attempt < 500; attempt++) {
        if (placeWord(word)) break;
      }
    }
  }

  fillEmptyCells();
  updateScore();
  updateTurnDisplay();
  checkGameEnd();
}

function createGrid() {
  gameEl.innerHTML = '';
  for (let i = 0; i < totalCells; i++) {
    const cell = document.createElement('div');
    cell.className = 'cell';
    cell.onclick = () => { if (!resultShown && currentPlayer === 'user') handleClick(i); };
    gameEl.appendChild(cell);
  }
}

function canPlaceWord(word, x, y, dx, dy) {
  for (let i = 0; i < word.length; i++) {
    let nx = x + dx * i, ny = y + dy * i;
    if (nx < 0 || ny < 0 || nx >= gridSize || ny >= gridSize) return false;
    let idx = ny * gridSize + nx;
    if (board[idx] && board[idx] !== word[i]) return false;
    if (usedIndexes.has(idx)) return false;
  }
  return true;
}

function placeWord(word) {
  const directions = [{ x: 1, y: 0 }, { x: 0, y: 1 }, { x: 1, y: 1 }];
  const shuffledDirections = directions.sort(() => Math.random() - 0.5);
  for (let dir of shuffledDirections) {
    const startY = Math.floor(Math.random() * gridSize);
    for (let i = 0; i < gridSize; i++) {
      const y = (startY + i) % gridSize;
      for (let x = 0; x < gridSize; x++) {
        if (canPlaceWord(word, x, y, dir.x, dir.y)) {
          let positions = [];
          for (let i = 0; i < word.length; i++) {
            let nx = x + dir.x * i, ny = y + dir.y * i, idx = ny * gridSize + nx;
            board[idx] = word[i];
            usedIndexes.add(idx);
            positions.push(idx);
          }
          wordMap[word] = { positions: positions, direction: [dir.x, dir.y] };
          return true;
        }
      }
    }
  }
  return false;
}

function checkDirectionVariety() {
  let directionCount = { '1,0': 0, '0,1': 0, '1,1': 0 };
  for (let word in wordMap) {
    const direction = wordMap[word].direction;
    const key = direction[0] + ',' + direction[1];
    if (directionCount.hasOwnProperty(key)) directionCount[key]++;
  }
  return directionCount['1,0'] > 0 && directionCount['0,1'] > 0 && directionCount['1,1'] > 0;
}

function placeAllWordsWithVariety() {
  let attempts = 0;
  const maxAttempts = 10;
  do {
    board = Array(totalCells).fill(null);
    usedIndexes.clear();
    wordMap = {};
    let allPlaced = true;
    const sortedWords = [...words].sort((a, b) => b.length - a.length);
    for (let word of sortedWords) {
      if (!placeWord(word)) { allPlaced = false; break; }
    }
    if (allPlaced && checkDirectionVariety()) return true;
    attempts++;
  } while (attempts < maxAttempts);
  return false;
}

function fillEmptyCells() {
  for (let j = 0; j < totalCells; j++) {
    if (usedIndexes.has(j)) continue;
    board[j] = countAdjacentLetters(j);
  }
}

function countAdjacentLetters(idx) {
  const x = idx % gridSize, y = Math.floor(idx / gridSize);
  let count = 0;
  for (let dy = -1; dy <= 1; dy++) {
    for (let dx = -1; dx <= 1; dx++) {
      if (dx === 0 && dy === 0) continue;
      const nx = x + dx, ny = y + dy;
      if (nx >= 0 && nx < gridSize && ny >= 0 && ny < gridSize) {
        if (usedIndexes.has(ny * gridSize + nx)) count++;
      }
    }
  }
  return count;
}

function reveal(index) {
  if (revealed[index]) return;
  revealed[index] = true;
  const cell = gameEl.children[index];

  if (usedIndexes.has(index)) {
    cell.textContent = board[index];
  } else {
    const num = board[index];
    cell.textContent = num === 0 ? '' : num;
    cell.classList.add('num');
    cell.classList.add('num-' + num);

    if (num === 0) {
      const x = index % gridSize, y = Math.floor(index / gridSize);
      for (let dy = -1; dy <= 1; dy++) {
        for (let dx = -1; dx <= 1; dx++) {
          if (dx === 0 && dy === 0) continue;
          const nx = x + dx, ny = y + dy;
          if (nx >= 0 && nx < gridSize && ny >= 0 && ny < gridSize) {
            const nIdx = ny * gridSize + nx;
            if (!revealed[nIdx]) reveal(nIdx);
          }
        }
      }
    }
  }
  cell.classList.add('revealed');
}

function updateScore() {
  const userHTML = `<h2>사용자:</h2>` + foundBy.user.map(w => `<p>${w}</p>`).join("");
  const npcHTML = `<h2>컴퓨터:</h2>` + foundBy.npc.map(w => `<p>${w}</p>`).join("");
  userScoreEl.innerHTML = userHTML;
  npcScoreEl.innerHTML = npcHTML;
  userScoreMobileEl.innerHTML = userHTML;
  npcScoreMobileEl.innerHTML = npcHTML;
}

function updateTurnDisplay() {
  if (resultShown) return;
  const name = currentPlayer === 'user' ? 'USER' : 'NPC';
  const difficultyLabel = { normal: '(쉬움)', hard: '(어려움)' };
  currentTurnEl.textContent = `${name}의 차례입니다. ${currentPlayer === 'npc' ? difficultyLabel[npcDifficulty] : ''}`;
}

function switchTurn() {
  currentPlayer = currentPlayer === 'user' ? 'npc' : 'user';
  updateTurnDisplay();
  if (currentPlayer === 'npc' && !resultShown) {
    npcTimeoutId = setTimeout(() => { npcMove(); }, 1000);
  }
}

function npcMove() {
  if (resultShown) return;
  const availableCells = [];
  for (let i = 0; i < totalCells; i++) if (!revealed[i]) availableCells.push(i);
  if (availableCells.length === 0) return;

  let selectedCell;

  if (npcDifficulty === 'normal') {
    let nearRevealedCells = [];
    for (let i = 0; i < totalCells; i++) {
      if (revealed[i]) nearRevealedCells.push(...getAdjacentCells(i));
    }
    nearRevealedCells = [...new Set(nearRevealedCells)];
    selectedCell = nearRevealedCells.length > 0
      ? nearRevealedCells[Math.floor(Math.random() * nearRevealedCells.length)]
      : availableCells[Math.floor(Math.random() * availableCells.length)];

  } else if (npcDifficulty === 'hard') {
    let numberedRevealed = [];
    for (let i = 0; i < totalCells; i++) {
      if (revealed[i] && !usedIndexes.has(i) && typeof board[i] === 'number' && board[i] > 0) {
        numberedRevealed.push({ idx: i, value: board[i] });
      }
    }
    numberedRevealed.sort((a, b) => b.value - a.value);

    selectedCell = null;
    for (let entry of numberedRevealed) {
      const candidates = getAdjacentCells(entry.idx);
      if (candidates.length > 0) {
        selectedCell = candidates[Math.floor(Math.random() * candidates.length)];
        break;
      }
    }
    if (!selectedCell) {
      selectedCell = availableCells[Math.floor(Math.random() * availableCells.length)];
    }
  }

  handleClick(selectedCell, true);
}

function handleClick(index, isnpcMove = false) {
  if (revealed[index] || resultShown) return;
  if (currentPlayer === 'npc' && !isnpcMove) return;
  if (currentPlayer === 'user' && isnpcMove) return;

  reveal(index);
  checkWords();
  checkGameEnd();

  if (!resultShown) switchTurn();
}

function checkWords() {
  for (let word of Object.keys(wordMap)) {
    if (foundWords.has(word)) continue;
    const pos = wordMap[word].positions;
    if (pos.every(i => revealed[i])) {
      foundWords.add(word);
      foundBy[currentPlayer].push(word);
      pos.forEach(i => {
        const cell = gameEl.children[i];
        cell.classList.add(currentPlayer === 'user' ? 'word-owned-user' : 'word-owned-npc');
      });
      updateScore();
    }
  }
}

function checkGameEnd() {
  const totalWords = Object.keys(wordMap).length;
  if (foundWords.size >= totalWords && totalWords > 0) {
    resultShown = true;
    if (npcTimeoutId) { clearTimeout(npcTimeoutId); npcTimeoutId = null; }
    const userWords = foundBy.user.length;
    const npcWords = foundBy.npc.length;
    let winner = userWords > npcWords ? 'USER WINS!' : npcWords > userWords ? 'NPC WINS!' : 'DRAW!';
    currentTurnEl.textContent = `Game Over! ${winner}승리!`;
    setTimeout(() => {
      alert(`게임 종료!\n\n사용자: ${userWords} 단어\n컴퓨터: ${npcWords} 단어\n\n${winner} 승리!`);
    }, 500);
  }
}

retryBtn.onclick = () => { startGame(npcDifficulty); };
</script>
